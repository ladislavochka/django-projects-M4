{% extends 'base.html' %}
{% block content %}
<div class="container mt-3">
    <h2>{{ object.title }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="color:red">
            {{ form.errors }}
        </div>
        <button type="submit" class="btn btn-success">Save(Зберегти)</button>
    </form>
</div>
{% endblock %}
