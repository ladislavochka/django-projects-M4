{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAMELAKA</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <img src="{% static 'img/logo.png' %}" height="45">
      <span class="ms-2">
          NAMELAKA
      </span>

    <div class="ms-auto d-flex align-items-center gap-3">
      <a class="nav-link" href="{% url 'tasks:task-list' %}">Dashboard</a>
      <a class="nav-link" href="{% url 'tasks:register' %}">Register</a>

      <form action="{% url 'tasks:logout' %}" method="post">
        {% csrf_token %}
        <button class="btn btn-light rounded-pill px-4">Logout</button>
      </form>
    </div>
  </div>
</nav>

<div class="main-container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
