<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Головна{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    {% block extra_head %}{% endblock %}

    <style>
      :root {
        --mono-black: #0a0a0a;
        --mono-dark: #1a1a1a;
        --mono-gray: #6b6b6b;
        --mono-light-gray: #f6f6f6;
        --mono-border: #e4e4e7;
        --mono-white: #ffffff;
        --ink: #000000;
        --gray: #707070;
        --light-gray: #f5f5f7;
        --border-color: #e5e5e5;
        --primary-btn: #000000;
        --primary-btn-hover: #222222;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background-color: var(--mono-light-gray);
        color: var(--mono-black);
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
      }

      /* ===== Navbar ===== */
      .navbar {
        background-color: var(--mono-black) !important;
        padding: 16px 32px;
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      .navbar-brand {
        color: var(--mono-white) !important;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: -0.02em;
        padding: 8px 16px;
        border-radius: 10px;
        transition: background-color 0.15s ease;
        margin-right: 4px;
      }

      .navbar-brand:hover {
        background-color: rgba(255, 255, 255, 0.08);
        text-decoration: none;
      }

      .navbar form {
        margin-left: auto;
        display: flex;
      }

      .navbar form button {
        background-color: transparent;
        color: var(--mono-white);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 999px;
        padding: 8px 20px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .navbar form button:hover {
        background-color: var(--mono-white);
        color: var(--mono-black);
        border-color: var(--mono-white);
      }

      /* ===== Layout container ===== */
      .content-wrapper {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 20px 64px;
      }

      /* ===== Generic monobank-style components ===== */
      .card, .panel {
        background-color: var(--mono-white);
        border: 1px solid var(--mono-border);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      }

      h1, h2, h3, h4, h5 {
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--mono-black);
      }

      .btn, button[type="submit"] {
        border-radius: 999px;
        font-weight: 600;
        padding: 10px 24px;
        border: none;
        transition: transform 0.1s ease, opacity 0.15s ease;
      }

      .btn-primary {
        background-color: var(--mono-black);
        border-color: var(--mono-black);
        color: var(--mono-white);
      }

      .btn-primary:hover {
        background-color: #2a2a2a;
        border-color: #2a2a2a;
        transform: translateY(-1px);
      }

      input, textarea, select {
        border-radius: 12px !important;
        border: 1px solid var(--mono-border) !important;
        padding: 10px 14px !important;
      }

      input:focus, textarea:focus, select:focus {
        border-color: var(--mono-black) !important;
        box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.08) !important;
        outline: none;
      }

      /* ===== Swiper Carousel Styles ===== */
      .cardsSwiper {
        width: 100%;
        padding: 30px 0 50px !important;
      }

      .swiper-slide {
        width: 260px;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: flex-start !important;
        text-align: center !important;
        opacity: 0.45;
        transition: opacity 0.3s ease, transform 0.3s ease;
      }

      .swiper-slide-active {
        opacity: 1;
      }

      .card-image-wrap {
        width: 200px;
        margin: 0 auto 16px auto !important;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: transform 0.3s ease;
      }

      .swiper-slide img {
        width: 100%;
        height: auto;
        border-radius: 12px;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
        display: block;
        margin: 0 auto;
      }

      .swiper-slide-active .card-image-wrap {
        transform: scale(1.1);
      }

      .swiper-slide-active img {
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.16);
      }

      .card-info {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 8px;
      }

      .card-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--mono-black);
        margin-bottom: 6px;
        letter-spacing: -0.01em;
        text-align: center;
        width: 100%;
      }

      .card-desc {
        font-size: 13px;
        line-height: 1.4;
        color: var(--mono-gray);
        margin: 0 auto;
        max-width: 240px;
        text-align: center;
      }

      .swiper-button-next::after,
      .swiper-button-prev::after {
        font-size: 20px !important;
      }

      .swiper-button-next,
      .swiper-button-prev {
        color: var(--mono-black) !important;
      }

      .swiper-pagination-bullet-active {
        background: var(--mono-black) !important;
      }

      /* ===== OBSHCHIE KLASSY ===== */
      .section {
        padding: 80px 0;
      }

      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 20px;
      }

      .kicker {
        display: inline-block;
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--gray);
      }

      /* ===== 1. STATS ===== */
      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 20px;
        padding: 40px 0;
        justify-content: center;
        margin: 0 auto;
        max-width: 1100px;
      }

      .stat {
        background-color: var(--mono-black);
        border-radius: 28px;
        padding: 28px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        text-align: center;
        min-height: 220px;
        color: var(--mono-white);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        transition: transform 0.2s ease;
      }

      .stat:hover {
        transform: translateY(-4px);
      }

      .stat-icon {
        width: 44px;
        height: 44px;
        background-color: #1a1a1a;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        font-size: 20px;
      }

      .stat .num {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
        color: #ffffff;
        line-height: 1.1;
        text-align: center;
        width: 100%;
      }

      .stat .lbl {
        font-size: 14px;
        color: #a1a1aa;
        line-height: 1.35;
        margin: 0;
        text-align: center;
        width: 100%;
      }

      /* ===== 2. SUPPORT ===== */
      .wrap.support {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 60px;
        align-items: center;
      }

      .chat-mock {
        background: #ffffff;
        border: 1px solid var(--border-color);
        border-radius: 24px;
        padding: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-width: 440px;
        margin-left: auto;
      }

      .chat-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid #f0f0f0;
      }

      .chat-avatar {
        width: 40px;
        height: 40px;
        background: var(--ink);
        color: #fff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
      }

      .chat-head .name {
        font-size: 15px;
        font-weight: 700;
      }

      .chat-head .status {
        font-size: 12px;
        color: #34c759;
        font-weight: 500;
      }

      .bubble {
        max-width: 85%;
        padding: 12px 16px;
        border-radius: 18px;
        font-size: 14px;
        line-height: 1.4;
      }

      .bubble.them {
        background: var(--light-gray);
        color: var(--ink);
        align-self: flex-start;
        border-bottom-left-radius: 4px;
      }

      .bubble.me {
        background: var(--ink);
        color: #ffffff;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
      }

      .typing {
        display: flex;
        gap: 4px;
        padding: 8px 12px;
        background: var(--light-gray);
        border-radius: 12px;
        width: fit-content;
      }

      .typing span {
        width: 6px;
        height: 6px;
        background: #aaa;
        border-radius: 50%;
      }

      /* ===== 3. CTA ===== */
      .cta {
        background: var(--light-gray);
        padding: 80px 20px;
        text-align: center;
        border-radius: 32px;
        margin: 40px auto;
        max-width: 1100px;
      }

      .cta h2 {
        font-size: clamp(28px, 4vw, 44px);
        margin-bottom: 16px;
      }

      .cta p {
        font-size: 18px;
        color: var(--gray);
        margin-bottom: 32px;
      }

      .btn-mono {
        display: inline-block;
        padding: 14px 32px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 16px;
        text-decoration: none !important;
        transition: all 0.2s ease;
      }

      .btn-mono-primary {
        background: var(--ink);
        color: #ffffff !important;
      }

      .btn-mono-primary:hover {
        background: var(--primary-btn-hover);
        transform: translateY(-2px);
      }

      /* ===== 4. FOOTER ===== */
      footer {
        padding: 60px 0 40px;
        border-top: 1px solid var(--border-color);
        background: #ffffff;
      }

      footer .wrap:first-child {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }

      .foot-links {
        display: flex;
        gap: 24px;
      }

      .foot-links a {
        color: var(--gray);
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        transition: color 0.15s;
      }

      .foot-links a:hover {
        color: var(--ink);
      }

      .disclaimer {
        font-size: 13px;
        color: #999999;
        line-height: 1.5;
      }

      /* ===== TOASTS ===== */
      .cta-action-wrapper {
        position: relative;
        display: inline-block;
      }

      .app-toast {
        position: absolute;
        top: 120%;
        left: 50%;
        transform: translateX(-50%) translateY(10px) scale(0.95);
        background: #0a0a0a;
        color: #ffffff;
        padding: 12px 20px;
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        display: flex;
        align-items: center;
        gap: 10px;
        width: max-content;
        max-width: 320px;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.3;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        z-index: 100;
      }

      .app-toast::before {
        content: '';
        position: absolute;
        top: -6px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 0 7px 7px 7px;
        border-style: solid;
        border-color: transparent transparent #0a0a0a transparent;
      }

      .app-toast.show {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(0) scale(1);
      }

      .toast-icon {
        font-size: 20px;
        flex-shrink: 0;
      }

      .toast-text {
        text-align: left;
      }

      /* ===== JAR CARD ===== */
      .jar-card-dark {
        background-color: var(--mono-black);
        border-radius: 32px;
        padding: 48px 24px;
        text-align: center;
        color: var(--mono-white);
        max-width: 480px;
        margin: 20px auto;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .jar-card-dark h3 {
        color: #ffffff;
        font-size: 24px;
        margin-bottom: 8px;
      }

      .jar-card-dark p {
        color: #a1a1aa;
        font-size: 15px;
        margin-bottom: 24px;
      }

      .jar-wrapper {
        position: relative;
        width: 260px;
        height: 320px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
      }

      .jar-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        filter: drop-shadow(0 15px 25px rgba(51, 82, 255, 0.25));
      }

      .jar-percent-text {
        font-family: 'Inter', sans-serif;
        font-size: 38px;
        font-weight: 800;
        fill: #ffffff;
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
      }

      .falling-coin-1 { animation: floatCoin1 3s ease-in-out infinite alternate; }
      .falling-coin-2 { animation: floatCoin2 2.5s ease-in-out infinite alternate; }

      @keyframes floatCoin1 {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-6px) rotate(5deg); }
      }

      @keyframes floatCoin2 {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-8px) rotate(-6deg); }
      }

      /* ===== ADAPTIVE ===== */
      @media (max-width: 992px) {
        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 768px) {
        .wrap.support {
          grid-template-columns: 1fr;
          gap: 40px;
        }

        .chat-mock {
          max-width: 100%;
        }

        footer .wrap:first-child {
          flex-direction: column;
          align-items: flex-start;
          gap: 20px;
        }
      }

      @media (max-width: 576px) {
        .stats {
          grid-template-columns: 1fr;
        }

        .navbar {
          padding: 12px 16px;
        }

        .navbar-brand {
          font-size: 14px;
          padding: 6px 10px;
        }

        .content-wrapper {
          padding: 24px 16px 48px;
        }
      }
    </style>
</head>
<body>

    {% block content %}
    {% endblock %}

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
