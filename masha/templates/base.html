<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Planet Cinema</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: 'Montserrat', sans-serif;
            background: #0d0d0d;
            color: white;
        }

        .navbar{
            background: linear-gradient(90deg,#120018,#26003a,#4d0070);
            box-shadow: 0 4px 15px rgba(183,0,255,.35);
        }

        .navbar-brand{
            color:#ffffff !important;
            font-weight:600;
            transition:.3s;
        }

        .navbar-brand:hover{
            color:#ff4dd2 !important;
        }

        .logout-btn{
            background:#ff00b7;
            color:white;
            border:none;
            border-radius:30px;
            padding:8px 20px;
            font-weight:600;
            transition:.3s;
        }

        .logout-btn:hover{
            background:#d10095;
        }

        .container-main{
            margin-top:40px;
            background:#181818;
            border-radius:20px;
            padding:30px;
            box-shadow:0 0 25px rgba(183,0,255,.15);
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">

    <a class="navbar-brand" href="{% url 'tasks:task-list' %}">
        🎬 Planet Cinema
    </a>

    <div class="ml-auto d-flex align-items-center">

        <a class="navbar-brand mr-3" href="{% url 'tasks:task-list' %}">
            🎥 Афіша
        </a>

        <a class="navbar-brand mr-4" href="{% url 'tasks:register' %}">
            🍿 Реєстрація
        </a>

        <form action="{% url 'tasks:logout' %}" method="post" class="mb-0">
            {% csrf_token %}
            <button type="submit" class="logout-btn">
                Вийти
            </button>
        </form>

    </div>

</nav>

<div class="container container-main">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
