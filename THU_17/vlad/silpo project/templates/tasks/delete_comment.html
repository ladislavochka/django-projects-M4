{% extends 'base.html' %}

{% block title %}Видалення коментаря | СмакоПлан{% endblock %}
{% block page_kicker %}Коментар{% endblock %}
{% block page_title %}Видалити коментар?{% endblock %}

{% block content %}
<section class="market-panel danger-zone">
    <p class="danger-copy">Коментар буде видалений без повернення.</p>
    <form method="post" class="form-actions" data-confirm="Видалити цей коментар остаточно?">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Видалити</button>
        <a href="{{ request.META.HTTP_REFERER|default:'/' }}" class="btn btn-outline-secondary">Скасувати</a>
    </form>
</section>
{% endblock %}
