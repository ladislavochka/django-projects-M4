{% extends 'base.html' %}

{% block title %}Видалення | СмакоПлан{% endblock %}
{% block page_kicker %}Видалення{% endblock %}
{% block page_title %}Видалити задачу?{% endblock %}

{% block content %}
<section class="market-panel danger-zone">
    <p class="danger-copy">Задача <strong>{{ object.title }}</strong> буде видалена без повернення.</p>
    <form method="post" class="form-actions" data-confirm="Видалити цю задачу остаточно?">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Видалити</button>
        <a href="{% url 'tasks:task-list' %}" class="btn btn-outline-secondary">Скасувати</a>
    </form>
</section>
{% endblock %}
