{% extends "base.html" %}

{% block content %}

<h1>Мои проекты</h1>

<a href="{% url 'roomplanner:project-create' %}">
    Создать проект
</a>

<hr>

{% for project in projects %}

<div>

    <h3>{{ project.title }}</h3>

    <p>

        {{ project.room_width }}
        ×
        {{ project.room_height }}

    </p>

    <a href="{% url 'roomplanner:project-detail' project.pk %}">

        Открыть Planner

    </a>

</div>

<hr>

{% empty %}

<p>Проектов пока нет.</p>

{% endfor %}

{% endblock %}
