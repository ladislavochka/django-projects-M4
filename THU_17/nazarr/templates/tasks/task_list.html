{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="page-title mb-0">Мої завдання</h1>

    <a href="{% url 'tasks:task-create' %}" class="btn btn-nova">
        Нове завдання
    </a>
</div>

<div class="row g-4">
    {% for task in tasks %}
    <div class="col-md-6">
        <div class="task-card">
            <div class="d-flex justify-content-between mb-3">
                <h5 class="mb-0 fw-bold">{{ task.title }}</h5>
                <span class="badge-status">{{ task.status }}</span>
            </div>

            <p class="text-muted mb-3">
                {{ task.description|truncatechars:120 }}
            </p>

            <div class="d-flex justify-content-between align-items-center">
                <small class="text-muted">
                    До {{ task.due_date }}
                </small>

                <a href="{% url 'tasks:task_detail' task.pk %}" class="btn btn-outline-danger btn-sm">
                    Відкрити
                </a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <div class="nova-card">
            <div class="nova-card-body text-center py-5">
                <h4>Завдань поки немає</h4>
                <p class="text-muted">
                    Створіть перше завдання
                </p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
