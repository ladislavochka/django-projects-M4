{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="nova-card">
            <div class="nova-card-header">
                Вхід до системи
            </div>

            <div class="nova-card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <button type="submit" class="btn btn-nova w-100 mt-3">
                        Увійти
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="{% url 'tasks:register' %}" class="text-decoration-none">
                        Створити акаунт
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
