{% load static %}

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/nova.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark nova-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'tasks:task_list' %}">
            <span class="nova-logo">◼</span>
            Нова Пошта
        </a>

        <div class="ms-auto d-flex align-items-center gap-3">
            {% if user.is_authenticated %}
                <span class="text-white-50">{{ user.username }}</span>
                <a href="{% url 'tasks:task-create' %}" class="btn btn-light btn-sm">
                    Створити завдання
                </a>
                <a href="{% url 'tasks:logout' %}" class="btn btn-outline-light btn-sm">
                    Вийти
                </a>
            {% else %}
                <a href="{% url 'tasks:login' %}" class="btn btn-outline-light btn-sm">
                    Увійти
                </a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container py-5">
    {% block content %}{% endblock %}
</main>

</body>
</html>
