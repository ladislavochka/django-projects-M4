<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>BAZHANE | Task Tracking</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        :root{
            --black:#111111;
            --gold:#B08A45;
            --light:#FAFAFA;
            --border:#E6E6E6;
            --text:#333333;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:var(--light);
            font-family:'Montserrat',sans-serif;
            color:var(--text);
        }

        .navbar{
            background:white;
            padding:22px 70px;
            border-bottom:1px solid var(--border);
        }

        .navbar-brand{
            font-family:'Cormorant Garamond',serif;
            font-size:42px;
            letter-spacing:8px;
            color:var(--black)!important;
        }

        .navbar-nav{
            margin-left:auto;
            align-items:center;
        }

        .nav-link{
            color:var(--black)!important;
            margin-left:25px;
            font-size:14px;
            text-transform:uppercase;
            letter-spacing:2px;
            transition:.3s;
        }

        .nav-link:hover{
            color:var(--gold)!important;
        }

        .btn-brand{
            background:var(--black);
            color:white;
            border:none;
            padding:10px 26px;
            border-radius:40px;
            transition:.3s;
            margin-left:25px;
        }

        .btn-brand:hover{
            background:var(--gold);
            color:white;
        }

        .content{
            width:90%;
            max-width:1250px;
            margin:60px auto;
            background:white;
            padding:45px;
            border-radius:18px;
            border:1px solid var(--border);
            box-shadow:0 15px 40px rgba(0,0,0,.05);
        }

        h1,h2,h3,h4{
            font-family:'Cormorant Garamond',serif;
            color:var(--black);
            margin-bottom:25px;
        }

        .btn-primary{
            background:var(--black);
            border:none;
            border-radius:30px;
            padding:10px 22px;
        }

        .btn-primary:hover{
            background:var(--gold);
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,.06);
        }

        table{
            background:white;
        }

        table thead{
            background:var(--black);
            color:white;
        }

        input,
        textarea,
        select{
            border-radius:12px!important;
            border:1px solid #ddd!important;
        }

        input:focus,
        textarea:focus,
        select:focus{
            border-color:var(--gold)!important;
            box-shadow:0 0 0 .15rem rgba(176,138,69,.2)!important;
        }

        footer{
            text-align:center;
            color:#999;
            padding:40px;
            font-size:13px;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg">

    <a class="navbar-brand" href="{% url 'tasks:task-list' %}">
        BAZHANE
    </a>

    <div class="collapse navbar-collapse">

        <ul class="navbar-nav">

            <li class="nav-item">
                <a class="nav-link" href="{% url 'tasks:task-list' %}">
                    Головна
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'tasks:register' %}">
                    Реєстрація
                </a>
            </li>

            <li class="nav-item">
                <form action="{% url 'tasks:logout' %}" method="post">
                    {% csrf_token %}
                    <button class="btn-brand">
                        Вийти
                    </button>
                </form>
            </li>

        </ul>

    </div>

</nav>

<div class="content">

    {% block content %}
    {% endblock %}

</div>

<footer>
    © 2026 BAZHANE • Task Tracking
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
