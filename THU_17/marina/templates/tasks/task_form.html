{% extends 'base.html' %}

{% block content %}

<div class="card shadow-sm border-0">

    <div class="card-body p-5">

        <h2 class="mb-4">
            Створити завдання
        </h2>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="mt-4">

                <button type="submit" class="btn btn-primary">
                    Зберегти
                </button>

                <a href="{% url 'tasks:task-list' %}" class="btn btn-outline-dark ms-2">
                    Скасувати
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
