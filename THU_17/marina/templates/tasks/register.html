{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-sm border-0">

            <div class="card-body p-5">

                <h2 class="text-center mb-4">
                    Реєстрація
                </h2>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button class="btn btn-primary w-100">
                        Зареєструватися
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
