{% extends 'base.html' %}

{% block content %}

<div class="card shadow-sm border-0">

    <div class="card-body p-5 text-center">

        <h2 class="mb-4">
            Видалити завдання?
        </h2>

        <p class="text-muted">
            Ви дійсно хочете видалити
            <strong>"{{ object }}"</strong>?
        </p>

        <form method="post">

            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Видалити
            </button>

            <a href="{% url 'tasks:task-list' %}" class="btn btn-outline-dark ms-2">
                Скасувати
            </a>

        </form>

    </div>

</div>

{% endblock %}
